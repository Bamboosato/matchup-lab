name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: tennis-organizing-app-ci
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Run the audit separately so it has its own failure status and report.
        run: npm ci --no-audit --prefer-offline --progress=false

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx --no-install tsc --noEmit

      - name: Test
        run: npm test

      - name: Test security audit policy
        run: npm run test:security

      - name: Audit dependencies
        run: npm run audit:security

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e -- --workers=1

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: .security-audit/*.json
          if-no-files-found: ignore
